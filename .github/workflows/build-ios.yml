name: iOS CI

on:
  push:
    branches:
      - main
      - ios-milestone-1
    paths:
      - 'ios/**'
      - 'release-assets/dosefolk-appicon/**'
      - 'PROTOCOL_SPEC.md'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'release-assets/dosefolk-appicon/**'
      - 'PROTOCOL_SPEC.md'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/Dosefolk
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Materialize Dosefolk AppIcon
        run: |
          set -euo pipefail
          SOURCE="../../release-assets/dosefolk-appicon"
          OUT="Dosefolk/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          JPEG="$RUNNER_TEMP/dosefolk-appicon.jpg"
          python3 - "$SOURCE" "$JPEG" <<'PY'
          import base64
          import hashlib
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          payload = "".join(
              path.read_text(encoding="utf-8").strip()
              for path in sorted(source.glob("part-*.b64"))
          )[:91484]
          assert len(payload) == 91484
          data = base64.b64decode(payload, validate=True)
          assert hashlib.sha256(data).hexdigest() == "ef3d8b4feac711849e0e090f6fa551262ac145fecf95da04ab85625b7f3ef939"
          pathlib.Path(sys.argv[2]).write_bytes(data)
          PY
          sips -s format png "$JPEG" --out "$OUT" >/dev/null
          test -f "$OUT"
          test "$(sips -g pixelWidth "$OUT" | awk '/pixelWidth/ {print $2}')" = "1024"
          test "$(sips -g pixelHeight "$OUT" | awk '/pixelHeight/ {print $2}')" = "1024"
          test "$(sips -g hasAlpha "$OUT" | awk '/hasAlpha/ {print $2}')" = "no"

      - name: Validate privacy manifest
        run: |
          set -euo pipefail
          MANIFEST="Dosefolk/PrivacyInfo.xcprivacy"
          test -f "$MANIFEST"
          plutil -lint "$MANIFEST"
          grep -q 'NSPrivacyAccessedAPICategoryUserDefaults' "$MANIFEST"
          grep -q 'CA92.1' "$MANIFEST"

      - name: Validate notification entitlements
        run: |
          set -euo pipefail
          ENTITLEMENTS="Dosefolk/Dosefolk.entitlements"
          test -f "$ENTITLEMENTS"
          plutil -lint "$ENTITLEMENTS"
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$ENTITLEMENTS")" = "development"
          grep -q 'path: Dosefolk/Dosefolk.entitlements' project.yml
          grep -q 'aps-environment: development' project.yml

      - name: Validate AppIcon catalog scaffold
        run: |
          set -euo pipefail
          CATALOG="Dosefolk/Assets.xcassets/Contents.json"
          APPICON="Dosefolk/Assets.xcassets/AppIcon.appiconset/Contents.json"
          ICON="Dosefolk/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          test -f "$CATALOG"
          test -f "$APPICON"
          test -f "$ICON"
          python3 - "$CATALOG" "$APPICON" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              catalog = json.load(handle)
          with open(sys.argv[2], encoding="utf-8") as handle:
              appicon = json.load(handle)

          assert catalog.get("info", {}).get("author") == "xcode"
          assert catalog.get("info", {}).get("version") == 1
          assert appicon.get("info", {}).get("author") == "xcode"
          assert appicon.get("info", {}).get("version") == 1
          assert any(
              image.get("filename") == "AppIcon-1024.png"
              and image.get("idiom") == "universal"
              and image.get("platform") == "ios"
              and image.get("size") == "1024x1024"
              for image in appicon.get("images", [])
          )
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate generated entitlements binding
        run: |
          set -euo pipefail
          PBXPROJ="Dosefolk.xcodeproj/project.pbxproj"
          test -f "$PBXPROJ"
          grep -q 'CODE_SIGN_ENTITLEMENTS = Dosefolk/Dosefolk.entitlements;' "$PBXPROJ"
          grep -q 'TARGETED_DEVICE_FAMILY = "1,2";' "$PBXPROJ"
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 17.0;' "$PBXPROJ"
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;' "$PBXPROJ"

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project Dosefolk.xcodeproj \
            -scheme Dosefolk \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate unsigned iOS archive
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/Dosefolk.xcarchive"
          xcodebuild \
            -project Dosefolk.xcodeproj \
            -scheme Dosefolk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Dosefolk.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          APP="$RUNNER_TEMP/Dosefolk.xcarchive/Products/Applications/Dosefolk.app"
          INFO="$APP/Info.plist"
          test -d "$APP"
          test -f "$INFO"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/Assets.car"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          grep -q 'NSPrivacyAccessedAPICategoryUserDefaults' "$APP/PrivacyInfo.xcprivacy"
          grep -q 'CA92.1' "$APP/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")" = "com.ozkanmut.dosefolk"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO")" = "Dosefolk"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$INFO")" = "APPL"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")"
          test -n "$EXECUTABLE"
          test -x "$APP/$EXECUTABLE"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$INFO")" = "dosefolk"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$INFO")" = "false"
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$INFO" >/dev/null
          CAMERA_USAGE="$(/usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$INFO")"
          test -n "$CAMERA_USAGE"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$INFO" | grep -q 'fetch'
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$INFO" | grep -q 'remote-notification'
          /usr/libexec/PlistBuddy -c 'Print :BGTaskSchedulerPermittedIdentifiers' "$INFO" | grep -q 'com.ozkanmut.dosefolk.refresh'
          python3 - "$INFO" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as handle:
              info = plistlib.load(handle)

          assert info.get("MinimumOSVersion") == "17.0"
          assert info.get("CFBundleSupportedPlatforms") == ["iPhoneOS"]
          assert info.get("UIDeviceFamily") == [1, 2]
          assert info.get("UISupportedInterfaceOrientations") == [
              "UIInterfaceOrientationPortrait",
          ]
          assert info.get("UISupportedInterfaceOrientations~ipad") == [
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationPortraitUpsideDown",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          ]
          PY

      - name: Upload iOS archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dosefolk-iOS-unsigned-archive
          path: ${{ runner.temp }}/Dosefolk.xcarchive
          if-no-files-found: error
          retention-days: 30

      - name: Run iOS unit tests
        timeout-minutes: 12
        run: |
          set -euo pipefail
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; rs.sort(key=lambda r: tuple(int(x) for x in r.get("version","0").split("."))); print(rs[-1]["identifier"])')
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; ds=[d for d in json.load(sys.stdin)["devicetypes"] if d["name"].startswith("iPhone")]; preferred=[d for d in ds if d["name"]=="iPhone 16 Pro"]; print((preferred or ds)[-1]["identifier"])')
          UDID=$(xcrun simctl create 'Dosefolk CI' "$DEVICE_TYPE" "$RUNTIME_ID")
          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$UDID" >/dev/null 2>&1 || true' EXIT
          xcodebuild \
            -project Dosefolk.xcodeproj \
            -scheme Dosefolk \
            -destination "platform=iOS Simulator,id=$UDID" \
            -destination-timeout 120 \
            CODE_SIGNING_ALLOWED=NO \
            test
