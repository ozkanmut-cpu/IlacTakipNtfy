name: iOS CI

on:
  push:
    branches:
      - main
      - ios-milestone-1
    paths:
      - 'ios/**'
      - 'PROTOCOL_SPEC.md'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'PROTOCOL_SPEC.md'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/Dosefolk
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project Dosefolk.xcodeproj \
            -scheme Dosefolk \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run iOS unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Dosefolk.xcodeproj \
            -scheme Dosefolk \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            test
