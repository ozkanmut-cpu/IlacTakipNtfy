name: iOS CI

on:
  push:
    branches:
      - main
      - ios-milestone-1
    paths:
      - 'ios/**'
      - 'PROTOCOL_SPEC.md'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'PROTOCOL_SPEC.md'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/Dosefolk
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project Dosefolk.xcodeproj \
            -scheme Dosefolk \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run iOS unit tests
        run: |
          set -euo pipefail
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; rs.sort(key=lambda r: tuple(int(x) for x in r.get("version","0").split("."))); print(rs[-1]["identifier"])')
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; ds=[d for d in json.load(sys.stdin)["devicetypes"] if d["name"].startswith("iPhone")]; preferred=[d for d in ds if d["name"]=="iPhone 16 Pro"]; print((preferred or ds)[-1]["identifier"])')
          UDID=$(xcrun simctl create 'Dosefolk CI' "$DEVICE_TYPE" "$RUNTIME_ID")
          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$UDID" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild \
            -project Dosefolk.xcodeproj \
            -scheme Dosefolk \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test
