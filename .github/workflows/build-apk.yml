name: Build APK

on:
  push:
    branches: [ main, ios-milestone-1, encrypted-relay-migration ]
    paths-ignore:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install push gateway dependencies
        working-directory: server/push-gateway
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check push gateway syntax
        working-directory: server/push-gateway
        run: npm run check
      - name: Run push gateway tests
        working-directory: server/push-gateway
        run: npm test
      - name: Build push gateway container
        working-directory: server/push-gateway
        run: docker build --tag dosefolk-push-gateway:ci .
      - name: Verify bundled ntfy CLI
        run: docker run --rm --entrypoint ntfy dosefolk-push-gateway:ci --version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run reliability unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IlacTakip-debug
          path: app/build/outputs/apk/debug/app-debug.apk
