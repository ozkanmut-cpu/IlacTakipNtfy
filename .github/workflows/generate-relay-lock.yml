name: Generate Relay Lockfile

on:
  push:
    branches: [ encrypted-relay-migration ]
    paths:
      - '.github/workflows/generate-relay-lock.yml'
      - 'server/push-gateway/package.json'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: encrypted-relay-migration
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Regenerate lockfile without lifecycle scripts
        working-directory: server/push-gateway
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/push-gateway/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Lock relay sqlite dependency'
          git push origin HEAD:encrypted-relay-migration
