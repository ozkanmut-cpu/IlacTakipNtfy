services:
  dosefolk-push-gateway:
    build: .
    container_name: dosefolk-push-gateway
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 2587
      DATA_FILE: /data/registrations.json
      RELAY_METADATA_DB: /data/metadata/relay-metadata.sqlite3
      RELAY_QUEUE_DB: /data/queue/relay-queue.sqlite3
      APNS_BUNDLE_ID: com.ozkanmut.dosefolk
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_KEY_PATH: /run/secrets/apns_key.p8
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      INSTALL_HMAC_KEY: ${INSTALL_HMAC_KEY:-}
      INTERNAL_WAKE_SECRET: ${INTERNAL_WAKE_SECRET:-}
    ports:
      - "127.0.0.1:2587:2587"
    volumes:
      - ./data:/data
      - ./relay-metadata:/data/metadata
      - ./relay-queue:/data/queue
      - ./secrets:/run/secrets:ro
