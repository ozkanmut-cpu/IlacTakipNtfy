name: Dosefolk
options:
  bundleIdPrefix: com.ozkanmut
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Dosefolk:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Dosefolk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozkanmut.dosefolk
        PRODUCT_NAME: Dosefolk
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dosefolk
        INFOPLIST_KEY_NSCameraUsageDescription: "Dosefolk, Circle eşleştirme QR kodunu taramak için kamerayı kullanır."
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - DosefolkTests
  DosefolkTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - DosefolkTests
    resources:
      - path: ../../protocol-fixtures/dose-event-v9.json
      - path: ../../protocol-fixtures/ios-dose-event-v9.json
    dependencies:
      - target: Dosefolk
