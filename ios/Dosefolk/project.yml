name: Dosefolk
options:
  bundleIdPrefix: com.ozkanmut
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Dosefolk:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Dosefolk
    info:
      path: Dosefolk/Info.plist
      properties:
        CFBundleDisplayName: Dosefolk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.ozkanmut.dosefolk.enrollment
            CFBundleURLSchemes:
              - dosefolk
        NSCameraUsageDescription: "Dosefolk, Circle eşleştirme QR kodunu taramak için kamerayı kullanır."
        BGTaskSchedulerPermittedIdentifiers:
          - com.ozkanmut.dosefolk.refresh
        UIBackgroundModes:
          - fetch
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozkanmut.dosefolk
        PRODUCT_NAME: Dosefolk
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Dosefolk/Dosefolk.entitlements
      properties:
        aps-environment: development
    scheme:
      testTargets:
        - DosefolkTests
  DosefolkTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - DosefolkTests
    resources:
      - path: DosefolkTests/Fixtures
    dependencies:
      - target: Dosefolk
