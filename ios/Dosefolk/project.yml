name: Dosefolk
options:
  bundleIdPrefix: com.ozkanmut
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Dosefolk:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Dosefolk
    info:
      path: Dosefolk/Info.plist
      properties:
        CFBundleDisplayName: Dosefolk
        NSCameraUsageDescription: "Dosefolk, Circle eşleştirme QR kodunu taramak için kamerayı kullanır."
        BGTaskSchedulerPermittedIdentifiers:
          - com.ozkanmut.dosefolk.refresh
        UIBackgroundModes:
          - fetch
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozkanmut.dosefolk
        PRODUCT_NAME: Dosefolk
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - DosefolkTests
  DosefolkTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - DosefolkTests
    resources:
      - path: DosefolkTests/Fixtures
    dependencies:
      - target: Dosefolk
